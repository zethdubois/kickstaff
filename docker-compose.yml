# Host port 5043 — KAM 50xx family (+43 Postgres slot). Container still listens on 5432 inside.
services:
  postgres:
    image: postgres:16
    ports:
      - "5043:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: publicweb_dev
    volumes:
      - publicweb_pg_data:/var/lib/postgresql/data

volumes:
  publicweb_pg_data:
