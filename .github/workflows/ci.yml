# Runs on every branch (push + PR). Do not add `branches: [main]` unless you intend to limit checks.
# Gate is Typecheck / Unit tests / Production build. Node/ubuntu runner notices are warnings only.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Pin the image so the ubuntu-latest → 26 migration notice is not noise on every run.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build
